<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Websim MMORPG Template</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        canvas { display: block; }
        
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #stats {
            padding: 10px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            text-shadow: 1px 1px 2px black;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        /* Chat/Log area */
        #log {
            pointer-events: auto;
            max-height: 150px;
            overflow-y: auto;
            width: 300px;
            padding: 10px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            color: white;
            font-size: 14px;
            text-shadow: 1px 1px 1px black;
            mask-image: linear-gradient(to bottom, transparent, black 20%);
        }

        .name-tag {
            position: absolute;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            pointer-events: none;
            transform: translate(-50%, -100%);
            white-space: nowrap;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@0.160.0",
                "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading">Connecting to World...</div>
    <div id="ui-layer">
        <div id="stats">
            <div id="ping">Ping: -- ms</div>
            <div id="peers">Peers: 0</div>
            <div id="coords">Pos: (0, 0)</div>
        </div>
        <div id="log"></div>
    </div>
    
    <!-- Container for HTML labels (name tags) -->
    <div id="labels"></div>

    <script type="module" src="./src/main.js"></script>

</body>
</html>
